<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="نشان دفتر اسناد رسمی ۱۷۶۲ تهران">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M256 24 L452 92 V262 C452 372 372 452 256 488 C140 452 60 372 60 262 V92 Z"
        fill="url(#shield)"/>
  <!-- Gold rim -->
  <path d="M256 24 L452 92 V262 C452 372 372 452 256 488 C140 452 60 372 60 262 V92 Z"
        fill="none" stroke="url(#gold)" stroke-width="22" stroke-linejoin="round"/>
  <!-- Inner hairline -->
  <path d="M256 66 L414 121 V262 C414 350 348 416 256 447 C164 416 98 350 98 262 V121 Z"
        fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.45"/>

  <!-- Document -->
  <g transform="translate(0,-6)">
    <rect x="176" y="150" width="160" height="128" rx="14" fill="#fdf6e8"/>
    <rect x="176" y="150" width="160" height="128" rx="14" fill="none" stroke="#b45309" stroke-width="7"/>
    <line x1="205" y1="188" x2="307" y2="188" stroke="#0f172a" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <line x1="205" y1="220" x2="307" y2="220" stroke="#0f172a" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <line x1="205" y1="252" x2="266" y2="252" stroke="#0f172a" stroke-width="13" stroke-linecap="round" opacity="0.85"/>
    <!-- Notary seal / stamp -->
    <circle cx="318" cy="262" r="40" fill="url(#gold)" stroke="#fdf6e8" stroke-width="10"/>
    <path d="M300 262 l13 14 l25 -28" fill="none" stroke="#0f172a" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 1762 -->
  <text x="256" y="392" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="104" letter-spacing="4" fill="url(#gold)">1762</text>
</svg>
